server:
  port: 8080

spring:
  application:
    name: ecommerce-monolith

  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        # Store all @Enumerated(STRING) columns as plain VARCHAR (matches Flyway DDL).
        type.preferred_enum_jdbc_type: VARCHAR

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6380

  cache:
    type: redis
    redis:
      time-to-live: 60000ms

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  config: classpath:logback-spring.xml
